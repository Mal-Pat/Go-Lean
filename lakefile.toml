name = "Go-Lean"
version = "0.1.0"
keywords = ["software", "game"]
defaultTargets = ["GoLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[lean_lib]]
name = "GoLean"
globs = ["GoLean", "GoLean.+"]

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[require]]
name = "proofwidgets"
scope = "leanprover-community"
rev = "v0.0.98"
